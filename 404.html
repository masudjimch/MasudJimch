<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/content.js"></script>
<script src="js/themes.js"></script>
<script src="js/fonts.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
  .error-code { font-family: var(--font-mono); color: var(--gold); font-size: 1rem; letter-spacing: 0.1em; margin-bottom: 12px; }
  .error-title { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3rem); margin: 0 0 16px; }
  .error-text { color: var(--ink-soft); margin: 0 0 28px; }
</style>
</head>
<body>
  <div>
    <p class="error-code">404</p>
    <h1 class="error-title">Page not found</h1>
    <p class="error-text">The page you're looking for doesn't exist or may have moved.</p>
    <a class="btn btn-gold" href="index.html">← Back to homepage</a>
  </div>
</body>
</html>
